<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CP Assistant Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      color: #1f2430;
      font-size: 14px;
      line-height: 1.5;
    }
    h1 { font-size: 18px; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #d8dce3;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      margin-top: 14px;
      padding: 9px 16px;
      border: none;
      border-radius: 6px;
      background: #1f2430;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    .note {
      margin-top: 20px;
      font-size: 12.5px;
      color: #6b7280;
    }
    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <h1>🧠 CP Assistant — Settings</h1>

  <label for="apiKey">Groq API key</label>
  <input type="password" id="apiKey" placeholder="gsk_..." autocomplete="off" />
  <button id="saveBtn">Save</button>
  <div id="status"></div>

  <p class="note">
    Your key is stored only in this browser's local extension storage and is
    sent directly from your browser to Groq's API — it never passes
    through any third-party server. You can get a key at
    <a href="https://console.groq.com/keys" target="_blank">console.groq.com</a>.
  </p>

  <script src="options.js"></script>
</body>
</html>
